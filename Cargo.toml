[workspace]
resolver = "3"
members = [
  "crates/packvium-core",
  "crates/packvium-ffi",
  "bindings/python",
  "bindings/node",
]
default-members = ["crates/packvium-core", "crates/packvium-ffi"]

[workspace.package]
version = "1.8.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Packvium contributors"]
repository = "https://github.com/toxakara/packvium-native"
homepage = "https://packvium.com"

[workspace.dependencies]
libc = "0.2.180"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
# SHA-256 for the plan-revision chain (docs/PLAN-REVISIONS.md). Pure Rust, so the WASM
# package hashes too; default features off, it needs nothing from std.
sha2 = { version = "0.10.9", default-features = false }
web-time = "1.1.0"
packvium-core = { path = "crates/packvium-core", version = "1.8.0" }
